name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install documentation tooling
        run: |
          npm install -g markdownlint-cli@0.34.0 yaml-lint@1.7.0

      - name: Validate Markdown
        run: |
          find . \
            -name '*.md' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0 |
            xargs -0 -n1 markdownlint

      - name: Validate YAML
        run: |
          find . \
            -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' \
            -print0 |
            xargs -0 -n1 yaml-lint

  haru-haru:
    name: Haru Haru validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/haru-haru

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/haru-haru/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --runInBand